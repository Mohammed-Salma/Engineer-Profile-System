<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineer Profile System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <h1>Engineer Profile System</h1>
    </div>

    <input
      type="text"
      class="search"
      id="search"
      placeholder="Search for an engineer..."
    />

    <div id="engineersList"></div>

    <div id="modal" class="modal">
      <div class="modal-content">
        <h2 id="modalName"></h2>
        <p><strong>Specialty:</strong> <span id="modalSpecialty"></span></p>
        <p><strong>Experience:</strong> <span id="modalExperience"></span></p>
        <p><strong>Hiring Status:</strong> <span id="modalHired"></span></p>
        <div style="margin-top: 20px">
          <button id="hireBtn" class="btn" onclick="toggleHire()"></button>
          <button class="btn btn-close" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 Engineer Profile System</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
