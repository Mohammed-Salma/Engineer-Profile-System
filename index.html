<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineer Profile System</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
        padding: 20px;
        background: #f4f4f4;
      }
      .header {
        background: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .search {
        margin: 20px 0;
        padding: 10px;
        width: 300px;
      }
      .engineer-card {
        background: white;
        margin: 10px;
        padding: 15px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        border-left: 5px solid #e74c3c;
      }
      .hired {
        border-left-color: #2ecc71;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
      }
      .modal-content {
        background: white;
        padding: 20px;
        border-radius: 5px;
        width: 400px;
      }
      .footer {
        margin-top: 40px;
        text-align: center;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Engineer Profile System</h1>
    </div>

    <input
      type="text"
      class="search"
      id="search"
      placeholder="Search for an engineer..."
    />

    <div id="engineersList"></div>

    <div id="modal" class="modal">
      <div class="modal-content">
        <h2 id="modalName"></h2>
        <p><strong>Specialty:</strong> <span id="modalSpecialty"></span></p>
        <p><strong>Experience:</strong> <span id="modalExperience"></span></p>
        <p><strong>Hiring Status:</strong> <span id="modalHired"></span></p>
        <button onclick="toggleHire()">Change Hiring Status</button>
        <button onclick="closeModal()">Close</button>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 Engineer Profile System</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
